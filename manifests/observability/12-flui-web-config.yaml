apiVersion: v1
kind: ConfigMap
metadata:
  name: flui-web-config
  namespace: flui-system
  labels:
    app: flui-web
    app.kubernetes.io/name: flui-web
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: flui-web
    flui.cloud/managed: "true"
    flui.cloud/scope: "app"
    flui.cloud/owner-kind: "application"
    flui.cloud/owner-id: "flui-web"
    flui.cloud/app-slug: "flui-web"
data:
  config.json: |
    {
      "apiUrl": "http://${MASTER_IP}:30080",
      "wsUrl": "ws://${MASTER_IP}:30080",
      "authMode": "${AUTH_MODE}",
      "oidcIssuer": "https://${ZITADEL_DOMAIN}",
      "oidcClientId": "${ZITADEL_AUDIENCE}"
    }
