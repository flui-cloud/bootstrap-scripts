apiVersion: v1
kind: Service
metadata:
  name: flui-api
  namespace: default
  labels:
    app: flui-api
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
  selector:
    app: flui-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flui-api
  namespace: default
  labels:
    app: flui-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flui-api
  template:
    metadata:
      labels:
        app: flui-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: flui-api
          image: ghcr.io/flui-cloud/api:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: "fluicloud"
            - name: DB_PASSWORD
              value: "${POSTGRES_PASSWORD}"
            - name: DB_NAME
              value: "fluicloud"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: "${REDIS_PASSWORD}"
            - name: PROMETHEUS_ENDPOINT
              value: "http://prometheus:9090"
            - name: LOKI_ENDPOINT
              value: "http://loki:3100"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
