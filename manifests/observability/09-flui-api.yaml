apiVersion: v1
kind: Service
metadata:
  name: flui-api
  namespace: flui-system
  labels:
    app: flui-api
    app.kubernetes.io/name: flui-api
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: flui-api
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
  selector:
    app: flui-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flui-api
  namespace: flui-system
  labels:
    app: flui-api
    app.kubernetes.io/name: flui-api
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: flui-api
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flui-api
  template:
    metadata:
      labels:
        app: flui-api
        app.kubernetes.io/name: flui-api
        app.kubernetes.io/managed-by: flui-cloud
        app.kubernetes.io/instance: flui-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for postgres..."; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "Waiting for redis..."; sleep 2; done']
      containers:
        - name: flui-api
          image: ghcr.io/flui-cloud/api:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: flui-api-config
            - secretRef:
                name: flui-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health/ping
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ping
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
