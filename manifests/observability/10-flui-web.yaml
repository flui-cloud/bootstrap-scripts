apiVersion: v1
kind: Service
metadata:
  name: flui-web
  namespace: default
  labels:
    app: flui-web
    app.kubernetes.io/name: flui-web
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: flui-web
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30880
  selector:
    app: flui-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flui-web
  namespace: default
  labels:
    app: flui-web
    app.kubernetes.io/name: flui-web
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: flui-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flui-web
  template:
    metadata:
      labels:
        app: flui-web
    spec:
      containers:
        - name: flui-web
          image: ghcr.io/flui-cloud/web:latest
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: web-config
              mountPath: /usr/share/nginx/html/assets/config.json
              subPath: config.json
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: web-config
          configMap:
            name: flui-web-config
