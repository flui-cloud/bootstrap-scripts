apiVersion: v1
kind: Service
metadata:
  name: flui-web
  namespace: default
  labels:
    app: flui-web
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30880
  selector:
    app: flui-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flui-web
  namespace: default
  labels:
    app: flui-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flui-web
  template:
    metadata:
      labels:
        app: flui-web
    spec:
      containers:
        - name: flui-web
          image: ghcr.io/flui-cloud/web:latest
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
