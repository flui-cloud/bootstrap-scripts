apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-post-setup
  namespace: default
  labels:
    app: zitadel-post-setup
    app.kubernetes.io/name: zitadel-post-setup
    app.kubernetes.io/managed-by: flui-cloud
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: zitadel-post-setup
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      volumes:
        - name: bootstrap
          persistentVolumeClaim:
            claimName: zitadel-bootstrap-pvc
      initContainers:
        # Wait until Zitadel has written the admin PAT to the bootstrap volume
        - name: wait-for-pat
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Waiting for admin.pat..."
              until [ -f /bootstrap/admin.pat ]; do
                sleep 3
              done
              echo "admin.pat found"
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
      containers:
        - name: setup
          image: curlimages/curl:latest
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
          env:
            - name: ZITADEL_ADMIN_TEMP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: admin-temp-password
          command:
            - sh
            - -c
            - |
              set -e
              ZITADEL_URL="http://zitadel.default.svc.cluster.local:8080"
              PAT=$(cat /bootstrap/admin.pat | tr -d '\n')

              echo "→ Searching for flui-admin user..."
              RESPONSE=$(curl -sf -X POST "$ZITADEL_URL/v2/users/_search" \
                -H "Authorization: Bearer $PAT" \
                -H "Content-Type: application/json" \
                -d '{"queries":[{"userNameQuery":{"userName":"flui-admin","method":"TEXT_QUERY_METHOD_EQUALS"}}]}')

              USER_ID=$(echo "$RESPONSE" | grep -o '"userId":"[^"]*"' | head -1 | cut -d'"' -f4)

              if [ -z "$USER_ID" ]; then
                echo "ERROR: Could not find flui-admin user in response: $RESPONSE"
                exit 1
              fi

              echo "→ Setting password without changeRequired for user $USER_ID..."
              curl -sf -X POST "$ZITADEL_URL/v2/users/$USER_ID/password" \
                -H "Authorization: Bearer $PAT" \
                -H "Content-Type: application/json" \
                -d "{\"newPassword\":{\"password\":\"$ZITADEL_ADMIN_TEMP_PASSWORD\",\"changeRequired\":false}}"

              echo "✅ Zitadel post-setup complete (user: $USER_ID)"
