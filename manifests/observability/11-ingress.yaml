apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flui-api-ingress
  namespace: default
  labels:
    app: flui-api
    app.kubernetes.io/name: flui-api
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: flui-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: api.flui.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flui-api
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flui-web-ingress
  namespace: default
  labels:
    app: flui-web
    app.kubernetes.io/name: flui-web
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: flui-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: app.flui.cloud
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: flui-api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flui-web
                port:
                  number: 80
