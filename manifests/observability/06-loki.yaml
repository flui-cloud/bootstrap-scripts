apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: flui-observability
  labels:
    app: loki
    app.kubernetes.io/name: loki
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: loki
    flui.cloud/managed: "true"
    flui.cloud/scope: "app"
    flui.cloud/owner-kind: "application"
    flui.cloud/owner-id: "loki"
    flui.cloud/app-slug: "loki"
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    # Loki v3 requires schema v13 with TSDB index
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      filesystem:
        directory: /loki/chunks
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
        cache_ttl: 24h

    # Compactor is essential for TSDB performance and retention
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem

    limits_config:
      # Loki v3 has structured metadata enabled by default (requires schema v13 + tsdb)
      allow_structured_metadata: true
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      max_query_length: 721h
      # Retention period: 7 days (168h)
      retention_period: 168h

    distributor:
      ring:
        kvstore:
          store: inmemory

    ingester:
      chunk_idle_period: 1h
      chunk_target_size: 1048576
      max_chunk_age: 2h

    # Track cluster info via labels sent by Vector (server_id, cluster_id, etc.)
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: flui-observability
  labels:
    app: loki
    app.kubernetes.io/name: loki
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: loki
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  type: NodePort
  ports:
    - port: 3100
      targetPort: 3100
      nodePort: 30100
  selector:
    app: loki
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: flui-observability
  labels:
    app: loki
    app.kubernetes.io/name: loki
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: loki
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
    cluster: flui-observability
    component: logging
  annotations:
    description: "Loki log aggregation for Flui observability cluster"
    cluster_id: "${CLUSTER_ID}"
    server_id: "${SERVER_ID}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        app.kubernetes.io/name: loki
        app.kubernetes.io/managed-by: flui-cloud
        app.kubernetes.io/instance: loki
        cluster: flui-observability
        component: logging
      annotations:
        cluster_id: "${CLUSTER_ID}"
        server_id: "${SERVER_ID}"
    spec:
      containers:
        - name: loki
          image: grafana/loki:latest
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: storage
              mountPath: /loki
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: storage
          emptyDir: {}
