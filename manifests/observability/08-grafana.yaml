apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: flui-observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: grafana
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
  selector:
    app: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: flui-observability
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: grafana
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/managed-by: flui-cloud
        app.kubernetes.io/instance: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "${GRAFANA_PASSWORD}"
            - name: GF_INSTALL_PLUGINS
              value: ""
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: datasources
          configMap:
            name: grafana-config
