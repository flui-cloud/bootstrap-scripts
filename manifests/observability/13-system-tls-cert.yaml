apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  labels:
    app.kubernetes.io/managed-by: flui-cloud
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ADMIN_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-production-key
    solvers:
      - http01:
          ingress:
            class: traefik
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: flui-system-tls
  namespace: flui-system
  labels:
    app.kubernetes.io/managed-by: flui-cloud
spec:
  secretName: flui-system-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - auth.${FLUI_BASE_DOMAIN}
    - api.${FLUI_BASE_DOMAIN}
    - app.${FLUI_BASE_DOMAIN}
