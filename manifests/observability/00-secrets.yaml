apiVersion: v1
kind: ConfigMap
metadata:
  name: flui-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USERNAME: "fluicloud"
  DB_NAME: "fluicloud"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  DEPLOYMENT_MODE: "cluster"
  PROMETHEUS_ENDPOINT: "http://prometheus:9090"
  LOKI_ENDPOINT: "http://loki:3100"
  API_BASE_URL: "http://${MASTER_IP}:30080"
  WEBHOOK_BASE_URL: "http://${MASTER_IP}:30080"
---
apiVersion: v1
kind: Secret
metadata:
  name: flui-secrets
  namespace: default
type: Opaque
stringData:
  DB_PASSWORD: "${POSTGRES_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
