apiVersion: v1
kind: ConfigMap
metadata:
  name: flui-api-config
  namespace: default
  labels:
    app.kubernetes.io/name: flui-api
    app.kubernetes.io/managed-by: flui-cloud
    flui.cloud/managed: "true"
    flui.cloud/scope: "app"
    flui.cloud/owner-kind: "application"
    flui.cloud/owner-id: "flui-api"
    flui.cloud/app-slug: "flui-api"
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USERNAME: "fluicloud"
  DB_NAME: "fluicloud"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  DEPLOYMENT_MODE: "cluster"
  PROMETHEUS_ENDPOINT: "http://prometheus:9090"
  LOKI_ENDPOINT: "http://loki:3100"
  API_BASE_URL: "http://${MASTER_IP}:30080"
  WEBHOOK_BASE_URL: "http://${MASTER_IP}:30080"
  AUTH_MODE: "${AUTH_MODE}"
  ZITADEL_ISSUER: "https://${ZITADEL_DOMAIN}"
---
apiVersion: v1
kind: Secret
metadata:
  name: flui-secrets
  namespace: default
  labels:
    app.kubernetes.io/name: flui-api
    app.kubernetes.io/managed-by: flui-cloud
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
type: Opaque
stringData:
  DB_PASSWORD: "${POSTGRES_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
  GRAFANA_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
  ZITADEL_AUDIENCE: "${ZITADEL_AUDIENCE}"
  ZITADEL_SERVICE_ACCOUNT_PAT: "${ZITADEL_SERVICE_ACCOUNT_PAT}"
  JWT_SECRET: "${JWT_SECRET}"
  ADMIN_EMAIL: "${ADMIN_EMAIL}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
