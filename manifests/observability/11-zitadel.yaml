apiVersion: v1
kind: Secret
metadata:
  name: zitadel-secrets
  namespace: default
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: zitadel
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
type: Opaque
stringData:
  masterkey: "${ZITADEL_MASTERKEY}"
  db-admin-password: "${ZITADEL_DB_ADMIN_PASSWORD}"
  db-user-password: "${ZITADEL_DB_USER_PASSWORD}"
  admin-temp-password: "${ZITADEL_ADMIN_TEMP_PASSWORD}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-config
  namespace: default
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: zitadel
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
data:
  config.yaml: |
    ExternalDomain: ${ZITADEL_DOMAIN}
    ExternalSecure: true

    TLS:
      Enabled: false

    Database:
      postgres:
        Host: postgres.default.svc.cluster.local
        Port: 5432
        Database: zitadel
        MaxOpenConns: 10
        MaxIdleConns: 5
        User:
          Username: zitadel_user
          SSL:
            Mode: require
        Admin:
          Username: zitadel_admin
          SSL:
            Mode: require

    DefaultInstance:
      InstanceName: Flui.Cloud
      Org:
        Name: Flui
        Human:
          UserName: ${ZITADEL_ADMIN_EMAIL}
          Email:
            Address: ${ZITADEL_ADMIN_EMAIL}
            Verified: true

      LabelPolicy:
        DisableWatermark: true
        HideLoginNameSuffix: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-init
  namespace: default
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: zitadel-init
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: zitadel-init
          image: ghcr.io/zitadel/zitadel:latest
          args: ["init", "--config", "/config/config.yaml"]
          env:
            - name: ZITADEL_MASTERKEY
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: masterkey
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: db-admin-password
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: db-user-password
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: zitadel-config
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zitadel-setup
  namespace: default
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: zitadel-setup
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-init
          image: bitnami/kubectl:latest
          command:
            - kubectl
            - wait
            - --for=condition=complete
            - job/zitadel-init
            - -n
            - default
            - --timeout=120s
      containers:
        - name: zitadel-setup
          image: ghcr.io/zitadel/zitadel:latest
          args: ["setup", "--config", "/config/config.yaml"]
          env:
            - name: ZITADEL_MASTERKEY
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: masterkey
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: db-admin-password
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: db-user-password
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD_VALUE
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: admin-temp-password
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD_CHANGEREQUIRED
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: zitadel-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
  namespace: default
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: zitadel
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zitadel
  template:
    metadata:
      labels:
        app: zitadel
        app.kubernetes.io/name: zitadel
        app.kubernetes.io/managed-by: flui-cloud
        app.kubernetes.io/instance: zitadel
    spec:
      containers:
        - name: zitadel
          image: ghcr.io/zitadel/zitadel:latest
          args: ["start", "--config", "/config/config.yaml"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ZITADEL_MASTERKEY
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: masterkey
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: db-admin-password
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: db-user-password
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /debug/healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /debug/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: zitadel-config
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel
  namespace: default
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: zitadel
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  type: NodePort
  selector:
    app: zitadel
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30084
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zitadel
  namespace: default
  labels:
    app: zitadel
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${ZITADEL_DOMAIN}`)
      kind: Rule
      services:
        - name: zitadel
          port: 8080
  tls: {}
