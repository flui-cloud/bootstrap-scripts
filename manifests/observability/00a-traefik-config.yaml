apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      kind: DaemonSet
    hostNetwork: true
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    podSecurityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
      capabilities:
        drop: []
        add:
          - NET_BIND_SERVICE
      allowPrivilegeEscalation: true
    ports:
      metrics:
        port: 9101
      web:
        port: 80
        exposedPort: 80
        hostPort: 80
      websecure:
        port: 443
        exposedPort: 443
        hostPort: 443
        tls:
          enabled: true
