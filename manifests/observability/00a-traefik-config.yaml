apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      kind: DaemonSet
    hostNetwork: true
    updateStrategy:
      rollingUpdate:
        maxUnavailable: 1
    ports:
      web:
        port: 80
        exposedPort: 80
        hostPort: 80
      websecure:
        port: 443
        exposedPort: 443
        hostPort: 443
        tls:
          enabled: true
