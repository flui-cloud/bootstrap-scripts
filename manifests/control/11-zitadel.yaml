apiVersion: v1
kind: Secret
metadata:
  name: zitadel-secrets
  namespace: flui-system
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: zitadel
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
type: Opaque
stringData:
  masterkey: "${ZITADEL_MASTERKEY}"
  db-admin-password: "${ZITADEL_DB_ADMIN_PASSWORD}"
  db-user-password: "${ZITADEL_DB_USER_PASSWORD}"
  admin-temp-password: "${ZITADEL_ADMIN_TEMP_PASSWORD}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-config
  namespace: flui-system
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: zitadel
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
data:
  config.yaml: |
    ExternalDomain: ${ZITADEL_DOMAIN}
    ExternalSecure: true

    TLS:
      Enabled: false

    Database:
      postgres:
        Host: postgres.flui-system.svc.cluster.local
        Port: 5432
        Database: zitadel
        User:
          Username: zitadel_user
          SSL:
            Mode: disable
        Admin:
          Username: zitadel_admin
          SSL:
            Mode: disable

    DefaultInstance:
      InstanceName: Flui.Cloud
      Org:
        Name: Flui
        Human:
          UserName: flui-admin
          Email:
            Address: ${ZITADEL_ADMIN_EMAIL}
            Verified: true

      LabelPolicy:
        DisableWatermark: true
        HideLoginNameSuffix: true
---
# PVC shared between Zitadel (writes PAT) and the pat-inject job (reads PAT → flui-secrets)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zitadel-bootstrap-pvc
  namespace: flui-system
  labels:
    app: zitadel
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
  namespace: flui-system
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: zitadel
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zitadel
  template:
    metadata:
      labels:
        app: zitadel
        app.kubernetes.io/name: zitadel
        app.kubernetes.io/managed-by: flui-cloud
        app.kubernetes.io/instance: zitadel
    spec:
      enableServiceLinks: false
      containers:
        - name: zitadel
          image: ghcr.io/zitadel/zitadel:v4.15.0
          # start-from-init: runs init + setup + start in a single command
          args:
            - start-from-init
            - --masterkeyFromEnv
            - --config
            - /config/config.yaml
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ZITADEL_MASTERKEY
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: masterkey
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: db-admin-password
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: db-user-password
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-secrets
                  key: admin-temp-password
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
              value: "flui-admin"
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED
              value: "false"
            # flui-api-system: machine user (service account) for Flui API → IAM_OWNER
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME
              value: "flui-api-system"
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME
              value: "Flui API System"
            # ExpirationDate must be non-empty to trigger PAT generation
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE
              value: "2036-01-01T00:00:00Z"
            # PAT is written to the bootstrap PVC; sync-auth-domain reads and injects it into flui-secrets
            - name: ZITADEL_FIRSTINSTANCE_PATPATH
              value: "/bootstrap/flui-api-system.pat"
            # Disable LoginV2 redirect — default is true in recent Zitadel versions.
            - name: ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: bootstrap
              mountPath: /bootstrap
          livenessProbe:
            httpGet:
              path: /debug/healthz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /debug/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: zitadel-config
        - name: bootstrap
          persistentVolumeClaim:
            claimName: zitadel-bootstrap-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel
  namespace: flui-system
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: zitadel
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  type: ClusterIP
  selector:
    app: zitadel
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# IngressRoute for Zitadel API + Console
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: zitadel
  namespace: flui-system
  labels:
    app: zitadel
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${ZITADEL_DOMAIN}`)
      kind: Rule
      priority: 100
      services:
        - name: zitadel
          port: 8080
  tls: {}
