apiVersion: v1
kind: ConfigMap
metadata:
  name: flui-api-config
  namespace: flui-system
  labels:
    app.kubernetes.io/name: flui-api
    app.kubernetes.io/managed-by: flui-cloud
    flui.cloud/managed: "true"
    flui.cloud/scope: "app"
    flui.cloud/owner-kind: "application"
    flui.cloud/owner-id: "flui-api"
    flui.cloud/app-slug: "flui-api"
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_USERNAME: "fluicloud"
  DB_NAME: "fluicloud"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  DEPLOYMENT_MODE: "cluster"
  PROMETHEUS_ENDPOINT: "http://vmsingle.flui-control:8428"
  LOKI_ENDPOINT: "http://loki.flui-control:3100"
  GRAFANA_URL: "http://grafana.flui-control:3000"
  API_BASE_URL: "https://api.${FLUI_BASE_DOMAIN}"
  WEBHOOK_BASE_URL: "https://api.${FLUI_BASE_DOMAIN}"
  FRONTEND_URL: "https://app.${FLUI_BASE_DOMAIN}"
  AUTH_MODE: "${AUTH_MODE}"
  OIDC_ISSUER: "${OIDC_ISSUER}"
  OIDC_JWKS_URI: "${OIDC_JWKS_URI}"
  BUILDKIT_PRIVILEGED_MODE: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: flui-secrets
  namespace: flui-system
  labels:
    app.kubernetes.io/name: flui-api
    app.kubernetes.io/managed-by: flui-cloud
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
type: Opaque
data:
  SSH_CA_PRIVATE_KEY: "${SSH_CA_PRIVATE_KEY_B64}"
stringData:
  DB_PASSWORD: "${POSTGRES_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
  # Seals provider credentials and SSH private keys. Generated on the master at
  # bootstrap and reused across re-runs, so it never leaves the cluster.
  SSH_KEY_ENCRYPTION_KEY: "${SSH_KEY_ENCRYPTION_KEY}"
  GRAFANA_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
  # OIDC_AUDIENCE and ZITADEL_SERVICE_ACCOUNT_PAT are deliberately omitted: the
  # OIDC bootstrap provisions them at runtime. Declaring them here lets k3s
  # auto-deploy reset them to empty on every resync, wiping the bootstrap's patch.
  JWT_SECRET: "${JWT_SECRET}"
  # Shared with Alertmanager's webhook receiver (04d). Generated on the master at
  # bootstrap, so it never leaves the cluster.
  ALERTS_WEBHOOK_TOKEN: "${ALERTS_WEBHOOK_TOKEN}"
  ADMIN_EMAIL: "${ADMIN_EMAIL}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
  # BootstrapSeeder vars — read by NestJS API on startup to populate DB
  FLUI_CLI_API_KEY: "${FLUI_CLI_API_KEY}"
  PROVIDER_HETZNER_API_KEY: "${PROVIDER_HETZNER_API_KEY}"
  PROVIDER_SCALEWAY_ACCESS_KEY: "${PROVIDER_SCALEWAY_ACCESS_KEY}"
  PROVIDER_SCALEWAY_SECRET_KEY: "${PROVIDER_SCALEWAY_SECRET_KEY}"
  PROVIDER_REGIONS: "${PROVIDER_REGIONS}"
  CLUSTER_ID: "${CLUSTER_ID}"
  CLUSTER_NAME: "${CLUSTER_NAME}"
  CLOUD_PROVIDER: "${CLOUD_PROVIDER}"
  CLUSTER_REGION: "${CLUSTER_REGION}"
  INSTANCE_TYPE: "${INSTANCE_TYPE}"
  MASTER_IP: "${MASTER_IP}"
  FLUI_MASTER_PUBLIC_IP: "${FLUI_MASTER_PUBLIC_IP}"
  NIP_HOSTNAME_TOKEN: "${NIP_HOSTNAME_TOKEN}"
  SERVER_ID: "${SERVER_ID}"
  INSTANCE_ID: "${INSTANCE_ID}"
  INSTANCE_NAME: "${INSTANCE_NAME}"
  K3S_TOKEN: "${K3S_TOKEN}"
  K3S_VERSION: "${K3S_VERSION}"
  CLUSTER_FIREWALL_ID: "${CLUSTER_FIREWALL_ID}"
  FLUI_CA_PUBLIC_KEY: "${FLUI_CA_PUBLIC_KEY}"
  SSH_CA_PUBLIC_KEY: "${SSH_CA_PUBLIC_KEY}"
  FLUI_VNET_PROVIDER_RESOURCE_ID: "${FLUI_VNET_PROVIDER_RESOURCE_ID}"
  FLUI_VNET_PROVIDER: "${FLUI_VNET_PROVIDER}"
  FLUI_VNET_NAME: "${FLUI_VNET_NAME}"
  FLUI_VNET_IP_RANGE: "${FLUI_VNET_IP_RANGE}"
  FLUI_SUBNET_PROVIDER_RESOURCE_ID: "${FLUI_SUBNET_PROVIDER_RESOURCE_ID}"
  FLUI_SUBNET_IP_RANGE: "${FLUI_SUBNET_IP_RANGE}"
  FLUI_SUBNET_TYPE: "${FLUI_SUBNET_TYPE}"
  FLUI_SUBNET_NETWORK_ZONE: "${FLUI_SUBNET_NETWORK_ZONE}"
  FLUI_BOOTSTRAP_NODE_PRIVATE_IP: "${FLUI_BOOTSTRAP_NODE_PRIVATE_IP}"
  FLUI_NIP_IO_CERT_ENABLED: "${FLUI_NIP_IO_CERT_ENABLED}"
