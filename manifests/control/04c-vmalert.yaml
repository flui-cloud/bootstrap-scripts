apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: flui-control
  labels:
    app: vmalert
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/managed-by: flui-cloud
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
data:
  recording_rules.yml: |
    groups:
      - name: flui_app_cpu
        interval: 30s
        rules:
          - record: flui:app_cpu_usage_cores
            expr: |
              sum by (namespace, label_app_kubernetes_io_name) (
                rate(container_cpu_usage_seconds_total{
                  image!="",
                  container!="POD",
                  container!=""
                }[5m])
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_cpu_requests_cores
            expr: |
              sum by (namespace, label_app_kubernetes_io_name) (
                kube_pod_container_resource_requests{resource="cpu"}
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_cpu_limits_cores
            expr: |
              sum by (namespace, label_app_kubernetes_io_name) (
                kube_pod_container_resource_limits{resource="cpu"}
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_cpu_utilization_percent
            expr: |
              (flui:app_cpu_usage_cores / flui:app_cpu_limits_cores) * 100
          - record: flui:app_cpu_usage_cores_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name) (
                rate(container_cpu_usage_seconds_total{
                  image!="",
                  container!="POD",
                  container!=""
                }[5m])
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_cpu_requests_cores_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name) (
                kube_pod_container_resource_requests{resource="cpu"}
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_cpu_limits_cores_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name) (
                kube_pod_container_resource_limits{resource="cpu"}
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_cpu_utilization_percent_by_pod
            expr: |
              (flui:app_cpu_usage_cores_by_pod / flui:app_cpu_limits_cores_by_pod) * 100

      - name: flui_app_memory
        interval: 30s
        rules:
          - record: flui:app_memory_usage_bytes
            expr: |
              sum by (namespace, label_app_kubernetes_io_name) (
                container_memory_working_set_bytes{
                  image!="",
                  container!="POD",
                  container!=""
                }
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_memory_requests_bytes
            expr: |
              sum by (namespace, label_app_kubernetes_io_name) (
                kube_pod_container_resource_requests{resource="memory"}
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_memory_limits_bytes
            expr: |
              sum by (namespace, label_app_kubernetes_io_name) (
                kube_pod_container_resource_limits{resource="memory"}
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_memory_utilization_percent
            expr: |
              (flui:app_memory_usage_bytes / flui:app_memory_limits_bytes) * 100
          - record: flui:app_memory_usage_bytes_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name) (
                container_memory_working_set_bytes{
                  image!="",
                  container!="POD",
                  container!=""
                }
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_memory_requests_bytes_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name) (
                kube_pod_container_resource_requests{resource="memory"}
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_memory_limits_bytes_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name) (
                kube_pod_container_resource_limits{resource="memory"}
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_memory_utilization_percent_by_pod
            expr: |
              (flui:app_memory_usage_bytes_by_pod / flui:app_memory_limits_bytes_by_pod) * 100

      - name: flui_app_network
        interval: 30s
        rules:
          - record: flui:app_network_receive_bytes_rate
            expr: |
              sum by (namespace, label_app_kubernetes_io_name) (
                rate(container_network_receive_bytes_total{interface="eth0"}[5m])
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_network_transmit_bytes_rate
            expr: |
              sum by (namespace, label_app_kubernetes_io_name) (
                rate(container_network_transmit_bytes_total{interface="eth0"}[5m])
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_network_receive_bytes_rate_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name) (
                rate(container_network_receive_bytes_total{interface="eth0"}[5m])
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_network_transmit_bytes_rate_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name) (
                rate(container_network_transmit_bytes_total{interface="eth0"}[5m])
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )

      - name: flui_app_status
        interval: 15s
        rules:
          - record: flui:app_replicas_desired
            expr: |
              sum by (namespace, deployment) (
                kube_deployment_spec_replicas
                * on (namespace, deployment) group_left()
                label_replace(
                  kube_deployment_labels{label_app_kubernetes_io_managed_by="flui-cloud"},
                  "deployment", "$1", "deployment", "(.*)"
                )
              )
          - record: flui:app_replicas_ready
            expr: |
              sum by (namespace, deployment) (
                kube_deployment_status_replicas_ready
                * on (namespace, deployment) group_left()
                label_replace(
                  kube_deployment_labels{label_app_kubernetes_io_managed_by="flui-cloud"},
                  "deployment", "$1", "deployment", "(.*)"
                )
              )
          - record: flui:app_replicas_unavailable
            expr: |
              sum by (namespace, deployment) (
                kube_deployment_status_replicas_unavailable
                * on (namespace, deployment) group_left()
                label_replace(
                  kube_deployment_labels{label_app_kubernetes_io_managed_by="flui-cloud"},
                  "deployment", "$1", "deployment", "(.*)"
                )
              )
          - record: flui:app_status_ready_ratio
            expr: |
              flui:app_replicas_ready / flui:app_replicas_desired
          - record: flui:app_up
            expr: |
              (flui:app_replicas_ready == flui:app_replicas_desired)
              and
              (flui:app_replicas_desired > 0)
          - record: flui:app_restart_total
            expr: |
              sum by (namespace, label_app_kubernetes_io_name) (
                kube_pod_container_status_restarts_total
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_restart_rate_1h
            expr: |
              sum by (namespace, label_app_kubernetes_io_name) (
                increase(kube_pod_container_status_restarts_total[1h])
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_restart_total_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name) (
                kube_pod_container_status_restarts_total
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_restart_rate_1h_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name) (
                increase(kube_pod_container_status_restarts_total[1h])
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_pod_ready_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name) (
                kube_pod_status_ready{condition="true"}
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
          - record: flui:app_pod_phase_by_pod
            expr: |
              sum by (namespace, pod, label_app_kubernetes_io_name, phase) (
                (kube_pod_status_phase{phase=~"Running|Pending|Failed|Succeeded|Unknown"} > 0)
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )

      - name: flui_app_pods
        interval: 30s
        rules:
          - record: flui:app_pods_by_phase
            expr: |
              sum by (namespace, label_app_kubernetes_io_name, phase) (
                (kube_pod_status_phase{phase=~"Running|Pending|Failed|Succeeded|Unknown"} > 0)
                * on (namespace, pod) group_left(label_app_kubernetes_io_name)
                kube_pod_labels{label_app_kubernetes_io_managed_by="flui-cloud"}
              )
  alerting_rules.yml: |
    groups:
      # Conditions worth waking someone for. Every alert carries flui_kind so the
      # receiver can resolve the subject: `application` alerts key off the k8s label,
      # `traffic` alerts off the Traefik service id, `node` alerts off the instance.
      - name: flui_app_health
        interval: 30s
        rules:
          - alert: FluiAppDown
            expr: flui:app_up == 0
            for: 5m
            labels:
              severity: critical
              flui_kind: application
            annotations:
              summary: "Application {{ $labels.label_app_kubernetes_io_name }} is down"
              description: "No healthy replica in namespace {{ $labels.namespace }} for 5 minutes."

          - alert: FluiAppCrashLooping
            expr: flui:app_restart_rate_1h > 3
            for: 10m
            labels:
              severity: critical
              flui_kind: application
            annotations:
              summary: "Application {{ $labels.label_app_kubernetes_io_name }} is crash looping"
              description: "More than 3 container restarts in the last hour."

          - alert: FluiAppNotFullyReady
            expr: flui:app_status_ready_ratio < 1
            for: 15m
            labels:
              severity: warning
              flui_kind: application
            annotations:
              summary: "Application {{ $labels.label_app_kubernetes_io_name }} has unready replicas"

          - alert: FluiAppMemoryNearLimit
            expr: flui:app_memory_utilization_percent > 90
            for: 10m
            labels:
              severity: warning
              flui_kind: application
            annotations:
              summary: "Application {{ $labels.label_app_kubernetes_io_name }} is near its memory limit"
              description: "Above 90% of the configured limit for 10 minutes; an OOM kill is likely."

      - name: flui_app_traffic
        interval: 30s
        rules:
          # The rate guard matters more than the threshold: without it a single failed
          # request against an idle endpoint reads as a 100% error rate and pages someone.
          # `cluster_id` is kept in every `by` clause: vmagent stamps it as an external
          # label and all clusters remote-write into the same vmsingle, so aggregating
          # on `service` alone would merge two clusters' traffic into one alert and
          # leave the receiver unable to say which cluster it came from.
          - alert: FluiAppHighErrorRate
            expr: |
              (
                sum by (cluster_id, service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
                /
                sum by (cluster_id, service) (rate(traefik_service_requests_total[5m]))
              ) * 100 > 5
              and
              sum by (cluster_id, service) (rate(traefik_service_requests_total[5m])) > 0.05
            for: 10m
            labels:
              severity: critical
              flui_kind: traffic
            annotations:
              summary: "{{ $labels.service }} is returning server errors"
              description: "More than 5% of requests are 5xx over the last 10 minutes."

          - alert: FluiAppHighLatency
            expr: |
              histogram_quantile(
                0.95,
                sum by (cluster_id, service, le) (rate(traefik_service_request_duration_seconds_bucket[5m]))
              ) > 2
              and
              sum by (cluster_id, service) (rate(traefik_service_requests_total[5m])) > 0.05
            for: 10m
            labels:
              severity: warning
              flui_kind: traffic
            annotations:
              summary: "{{ $labels.service }} is slow"
              description: "p95 latency above 2s for 10 minutes."

      - name: flui_node
        interval: 30s
        rules:
          - alert: FluiNodeDiskNearFull
            expr: |
              100 - (
                (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100
              ) > 85
            for: 15m
            labels:
              severity: critical
              flui_kind: node
            annotations:
              summary: "Disk above 85% on {{ $labels.instance }}"
              description: "A full root filesystem takes the node down; free space or resize."

          - alert: FluiNodeDown
            expr: up{job="node-exporter"} == 0
            for: 5m
            labels:
              severity: critical
              flui_kind: node
            annotations:
              summary: "Node {{ $labels.instance }} is not reporting"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: flui-control
  labels:
    app: vmalert
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: vmalert
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
        app.kubernetes.io/name: vmalert
        app.kubernetes.io/managed-by: flui-cloud
        app.kubernetes.io/instance: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.99.0
          args:
            - '-rule=/etc/vmalert/recording_rules.yml'
            - '-rule=/etc/vmalert/alerting_rules.yml'
            - '-notifier.url=http://alertmanager.flui-control.svc.cluster.local:9093'
            - '-datasource.url=http://vmsingle.flui-control.svc.cluster.local:8428'
            - '-remoteWrite.url=http://vmsingle.flui-control.svc.cluster.local:8428'
            # Restores alert state on startup from what remoteWrite persisted. Without
            # it every vmalert restart re-fires each active alert with a fresh startsAt,
            # which reads downstream as a brand-new incident — so a platform upgrade
            # would page for everything already firing.
            - '-remoteRead.url=http://vmsingle.flui-control.svc.cluster.local:8428'
            - '-evaluationInterval=30s'
            - '-httpListenAddr=:8880'
          ports:
            - name: http
              containerPort: 8880
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
