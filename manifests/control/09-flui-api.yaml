apiVersion: v1
kind: Service
metadata:
  name: flui-api
  namespace: flui-system
  labels:
    app: flui-api
    app.kubernetes.io/name: flui-api
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: flui-api
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: flui-api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: flui-api
  namespace: flui-system
  labels:
    app: flui-api
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`api.${FLUI_BASE_DOMAIN}`)
      kind: Rule
      priority: 100
      services:
        - name: flui-api
          port: 3000
    # Live updates reach a browser through one copy of the API: a long-polling
    # session is known only to the copy that opened it, so its requests keep
    # going back there. Everything else is spread across the copies freely.
    - match: Host(`api.${FLUI_BASE_DOMAIN}`) && PathPrefix(`/socket.io/`)
      kind: Rule
      priority: 110
      services:
        - name: flui-api
          port: 3000
          sticky:
            cookie:
              name: flui_api_live
              secure: true
              httpOnly: true
              sameSite: lax
  tls: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flui-api
  namespace: flui-system
  labels:
    app: flui-api
    app.kubernetes.io/name: flui-api
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: flui-api
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/app-kind: "SYSTEM"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  selector:
    matchLabels:
      app: flui-api
  template:
    metadata:
      labels:
        app: flui-api
        app.kubernetes.io/name: flui-api
        app.kubernetes.io/managed-by: flui-cloud
        app.kubernetes.io/instance: flui-api
    spec:
      priorityClassName: flui-platform
      # Long jobs (migrations, backups, builds) run in-process; a copy being
      # removed gets time to finish them instead of leaving them stalled.
      terminationGracePeriodSeconds: 600
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: flui-api
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for postgres..."; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "Waiting for redis..."; sleep 2; done']
      containers:
        - name: flui-api
          image: ghcr.io/flui-cloud/core:${FLUI_API_IMAGE_TAG}
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: flui-api-config
            # Sensitive variables set on the flui-api application land here;
            # listed before flui-secrets so the installer's values always win.
            - secretRef:
                name: flui-api-secret
                optional: true
            - secretRef:
                name: flui-secrets
          # Without this the whole boot allowance was the liveness probe's 90
          # seconds, so anything slower was fatal rather than slow: a single
          # powered-off cluster once kept the API crashlooping. 5 minutes is
          # what makes the next slow boot survivable.
          startupProbe:
            httpGet:
              path: /api/v1/health/ping
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # A copy busy with a surge answers its ping late; restarting it then
          # throws away the requests it is serving and sends them all to the
          # others. Liveness only gives up after a minute of silence; readiness
          # takes a busy copy out of the route sooner, which moves the load.
          livenessProbe:
            httpGet:
              path: /api/v1/health/ping
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/v1/health/ping
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
---
# With more than one copy, a node drained for maintenance takes them away one
# at a time; with one, it does not stand in the way of the drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flui-api
  namespace: flui-system
  labels:
    app: flui-api
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
    flui.cloud/owner-kind: "platform"
    flui.cloud/owner-id: "flui-core"
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: flui-api
