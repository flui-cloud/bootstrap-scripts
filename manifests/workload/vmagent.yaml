apiVersion: v1
kind: Namespace
metadata:
  name: flui-monitoring
  labels:
    app.kubernetes.io/managed-by: flui-cloud
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  namespace: flui-monitoring
  labels:
    app: vmagent
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/managed-by: flui-cloud
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmagent-workload
  labels:
    app: vmagent
    app.kubernetes.io/managed-by: flui-cloud
    flui.cloud/managed: "true"
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmagent-workload
  labels:
    app: vmagent
    app.kubernetes.io/managed-by: flui-cloud
    flui.cloud/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmagent-workload
subjects:
  - kind: ServiceAccount
    name: vmagent
    namespace: flui-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: flui-monitoring
  labels:
    app: vmagent
    app.kubernetes.io/managed-by: flui-cloud
    flui.cloud/managed: "true"
data:
  vmagent.yaml: |
    global:
      scrape_interval: 30s
      external_labels:
        cluster_id: "${CLUSTER_ID}"
        cluster_name: "${CLUSTER_NAME}"
        cluster_type: "workload"

    scrape_configs:
      - job_name: kubernetes-nodes
        scheme: https
        tls_config:
          insecure_skip_verify: true
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: '([^:]+)(?::\d+)?'
            replacement: '${1}:9100'
            target_label: __address__
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: flui-monitoring
  labels:
    app: vmagent
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/managed-by: flui-cloud
    app.kubernetes.io/instance: vmagent
    flui.cloud/managed: "true"
    flui.cloud/scope: "system"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmagent
  template:
    metadata:
      labels:
        app: vmagent
        app.kubernetes.io/name: vmagent
        app.kubernetes.io/managed-by: flui-cloud
    spec:
      serviceAccountName: vmagent
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.99.0
          args:
            - '-promscrape.config=/etc/vmagent/vmagent.yaml'
            - '-remoteWrite.url=${REMOTE_WRITE_URL}'
            - '-remoteWrite.tmpDataPath=/buffer'
            - '-remoteWrite.maxDiskUsagePerURL=512MB'
            - '-promscrape.config.strictParse=false'
          ports:
            - name: http
              containerPort: 8429
          volumeMounts:
            - name: config
              mountPath: /etc/vmagent
            - name: buffer
              mountPath: /buffer
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8429
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8429
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: vmagent-config
        - name: buffer
          emptyDir: {}
